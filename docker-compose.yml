name: aarogya

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aarogya
      POSTGRES_PASSWORD: aarogya
      POSTGRES_DB: aarogya
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aarogya"]
      interval: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]


volumes:
  pgdata:
  qdrantdata:
